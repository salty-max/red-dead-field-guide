<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#281b15">
  <meta name="description" content="A spoiler-aware walkthrough and 100% completion checklist for the original Red Dead Redemption campaign.">
  <title>Red Dead Field Guide · Red Dead Redemption</title>
  <script>
    (() => {
      let preference;
      try { preference = localStorage.getItem("red-dead-field-guide.theme"); } catch {}
      const system = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = ["light", "dark"].includes(preference) ? preference : system;
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <script defer src="data/catalog.js"></script>
  <script defer src="data/early.js"></script>
  <script defer src="data/late.js"></script>
  <script defer src="data/side.js"></script>
  <script defer src="data/world.js"></script>
  <script defer src="data/challenges.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <button class="mobile-menu icon-button" type="button" data-action="toggle-menu" aria-label="Open chapters" aria-controls="chapter-rail" aria-expanded="false" id="menu-toggle"></button>
    <a class="brand" href="#guide" aria-label="Red Dead Field Guide home"><span class="brand-icon" id="brand-icon"></span><span class="brand-type"><strong>Red Dead</strong><small>FIELD GUIDE</small></span></a>
    <nav id="top-nav" class="top-nav" aria-label="Main navigation"></nav>
    <div class="topbar-actions">
      <button class="icon-button theme-toggle" id="theme-toggle" data-action="toggle-theme" type="button" hidden></button>
      <button class="save-status" data-action="settings" id="save-status" type="button"><span></span>Progress saved</button>
    </div>
  </header>
  <div class="layout">
    <aside class="rail" id="chapter-rail" aria-label="Chapters"></aside>
    <button class="scrim" data-action="toggle-menu" aria-label="Close chapters" hidden></button>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="status" class="sr-only" role="status"></div>
  <noscript><p class="no-js">Enable JavaScript to open the guide and save checklist progress.</p></noscript>
</body>
</html>
